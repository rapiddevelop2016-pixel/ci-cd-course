apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-gitops
  namespace: pulse-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-gitops
  template:
    metadata:
      labels:
        app: pulse-gitops
    spec:
      containers:
        - name: pulse-api
          image: ghcr.io/YOUR_GITHUB_USERNAME/pulse-cicd-lab:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-gitops-svc
  namespace: pulse-lab
spec:
  type: ClusterIP
  selector:
    app: pulse-gitops
  ports:
    - port: 8000
      targetPort: 8000
